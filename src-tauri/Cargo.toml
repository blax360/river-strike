[package]
name = "river-strike"
version = "1.0.0"
description = "RIVER STRIKE — arcade vertical de río por AKUMU GAMES"
authors = ["AKUMU GAMES"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
