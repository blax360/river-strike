name: build-macos

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust toolchain (aarch64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache de Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias JS
        run: npm install --no-audit --no-fund

      - name: Compilar app + DMG (Apple Silicon)
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Firma ad-hoc (para que macOS no la marque como dañada)
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/River Strike.app"
          if [ -d "$APP" ]; then
            codesign --force --deep --sign - "$APP" || true
          fi

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: RiverStrike-macos-arm64
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Publicar en Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          generate_release_notes: true
